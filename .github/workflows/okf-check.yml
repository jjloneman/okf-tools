name: 🩺 OKF check

# A reusable workflow: another repo calls it to run `okf check` on its OKF
# bundles, pinned by commit SHA (see the README's "In GitHub Actions").
#
# - Everything here runs against the caller's checkout: `github.*` is the
#   caller's context, and `./` would name a file in the caller's repo, so no
#   step uses this repo's local actions.
#
# - The status check is named `<caller's job> / 🩺 OKF check`, so renaming this
#   job renames every caller's required check.
on:
  workflow_call:
    inputs:
      bundles:
        default: ""
        description: Bundle directories to check, one per line; empty reads `okf.bundles` from package.json.
        required: false
        type: string
      changed:
        default: true
        description: Report only on the files the branch changed, as `--changed` does.
        required: false
        type: boolean
      node-version:
        default: "lts/*"
        description: The Node version to run okf on, as actions/setup-node reads it.
        required: false
        type: string
      okf-version:
        default: ""
        description: A version of @jjloneman/okf-tools to run from npm; empty runs the one the repo's own pnpm lockfile installs.
        required: false
        type: string
      strict:
        default: false
        description: Fail on warnings too, as `--strict` does.
        required: false
        type: boolean

# Nothing by default; the job grants only what it uses.
permissions: {}

jobs:
  check:
    name: 🩺 OKF check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The full history, so the base branch exists to diff against: a shallow
      # checkout has no base, and the trust rules' gate would see no change.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: ${{ inputs.okf-version == '' }}
        uses: pnpm/action-setup@v6.1.0
        with:
          cache: true

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      - if: ${{ inputs.okf-version == '' }}
        shell: bash
        run: pnpm install --frozen-lockfile

      # Point `origin/HEAD`, the base `okf check` diffs against first, at the
      # branch a pull request targets, or the default branch otherwise.
      #
      # - actions/checkout never sets it, so `okf check` would fall back to
      #   `origin/main`, which is wrong for a PR into any other branch.
      - if: ${{ github.base_ref != '' || github.event.repository.default_branch != '' }}
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        shell: bash
        run: git remote set-head origin "$BASE_REF"

      # The inputs reach the shell only through the environment, never spliced
      # into the script, so no value can run as code.
      - env:
          BUNDLES: ${{ inputs.bundles }}
          IS_CHANGED: ${{ inputs.changed }}
          IS_STRICT: ${{ inputs.strict }}
          OKF_VERSION: ${{ inputs.okf-version }}
        shell: bash
        run: |
          args=(check)
          if [[ "$IS_CHANGED" == true ]]; then
            args+=(--changed)
          fi
          if [[ "$IS_STRICT" == true ]]; then
            args+=(--strict)
          fi
          while read -r bundle; do
            if [[ -n "$bundle" ]]; then
              args+=(--bundle "$bundle")
            fi
          done <<< "$BUNDLES"

          if [[ -n "$OKF_VERSION" ]]; then
            npm exec --yes --package="@jjloneman/okf-tools@$OKF_VERSION" -- okf "${args[@]}"
          else
            pnpm okf "${args[@]}"
          fi
